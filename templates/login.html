<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie-edge,safari">
		<link rel="stylesheet" href="{{ url_for('static',filename='css/w3.css')}}">
		<title>Student Information V1.0</title>
	</head>
	<body onload="myfocus()">
		<div class="w3-bar w3-container w3-padding w3-blue" style="display: flex; align-items: center; justify-content: space-between;">
			<!-- Title aligned to the left -->
			<h3>Login</h3>
			
	
		</div>
<div class="w3-container w3-margin-top">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="w3-panel w3-red w3-card w3-round w3-padding w3-animate-opacity">
            <ul class="w3-ul">
                {% for message in messages %}
                    <li class="w3-text-white">{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    {% endwith %}   
    <style>
    .container {
        margin: 70px;
        background: white;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 350px;
        text-align: center;
        margin: auto;
    }
    a{
        display: inline-block;
        margin: 10px;
        padding: 10px 20px;
        text-decoration: none;
    }
    label {
        display: block;
        width: 50%;
        margin-left: 10px;
        margin-top: 10px;
        margin-bottom: 5px;
        text-align: left;
        color: black;
        font-weight: bold;
        font-size: 15px;
    }
    
    .forms {
        display: none;
    }
    
    #login-form:target, #signup-form:target {
        display: block;
    }
    
    .btn-clck{ 
        width: 60px;
        display: inline-block;
        margin: 10px;
        padding: 10px 20px;
        background: #FF9D3D;
        color: white;
        text-decoration: none;
        border-radius: 20px;
        transition: background 0.3s;
        margin-top: 15px;
        font-weight: bold;
        width: 100%;
        padding: 12px;
        color: white;
        background-color: #FF9D3D;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
    
    .btn-clck:hover {
        background-color: #F7F0E2;
        color: black;
    }
    
    input {
        width: calc(100% - 20px);
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 20px;
    }
    
    
    button:hover {
        background-color: #F7F0E2;
        color: black;
    }
    img{
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 30%;
        padding-bottom: 20px;
    }</style>
    <h3 class="w3-center">Scan your ID here</h3>
    <div class="container" style="opacity: 0;">
        
        <form action="/login" method="post">
            <label for="admin_id"></label>
            <input type="number" name="admin_id" id="admin_id" required>
        </form>
    </div>

    <script>
        function myfocus(){
            document.getElementById("admin_id").value="";
            document.getElementById("admin_id").focus();

        }
    </script>
