{% extends 'base.html' %}

{% block content %}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="w3-panel w3-padding w3-green w3-display-container">
                <span onclick="this.parentElement.style.display='none'" class="w3-button w3-green w3-large w3-display-topright">&times;</span>
                <b>{{ message }}</b>
            </div>            
            {% endfor %}
        {% endif %}
    {% endwith %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/webcamjs/1.0.25/webcam.min.js"></script>
<script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

<div class="w3-row-padding">
    <div class="w3-third w3-padding">
        <div class="w3-card-4 w3-container w3-padding">
            <form id="studentForm" action="/saveinformation" method="post" enctype="multipart/form-data" onsubmit="event.preventDefault(); submitForm();"> 
                <p class="w3-center">
                    <div id="webcam" style="width: 250px; height: 250px; margin: 0 auto; background-color: #f1f1f1; border: 2px dashed #ccc;"></div>
                </p>
                <p>
                    <label><b>IDNO</b></label>
                    <input type="text" name="idno" id="idno" class="w3-input" required oninput="validateIDNO()">
                </p>
                <p>
                    <label><b>FIRSTNAME</b></label>
                    <input type="text" name="firstname" id="firstname" class="w3-input" required oninput="enableSnapButton()">
                </p>
                <p>
                    <label><b>LASTNAME</b></label>
                    <input type="text" name="lastname" id="lastname" class="w3-input" required oninput="enableSnapButton()">
                </p>
                <p>
                    <label><b>SITIO</b></label>
                    <select name="sitio" id="sitio" class="w3-input w3-border w3-round-large" required onchange="enableSnapButton()">
                        <option value="">-- Select Sitio --</option>
                        <option value="BATO">BATO</option>
                        <option value="VENDOR">VENDOR</option>
                        <option value="YHC">YHC</option>
                        <option value="UYC">UYC</option>
                        <option value="KAWIT">KAWIT</option>
                        <option value="PANAGDAIT">PANAGDAIT</option>
                    </select>
                </p>
                <p>
                    <button type="button" id="snapButton" class="w3-button w3-green w3-round-large" onclick="capturePhoto()" disabled>SNAP</button>
                </p>
            </form>
        </div>
    </div>

    <div class="w3-twothird w3-padding">
        <div class="w3-card-4 w3-container w3-padding">
            <h3>Review Information</h3>
            <div style="display: flex; gap: 20px; align-items: flex-start;">
                <div style="flex: 1; text-align: center;">
                    <h4>Captured Photo</h4>
                    <img id="reviewPhoto" src="" style="max-width: 200px; height: auto; object-fit: cover; border: 1px solid #ccc; display: none;">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <p><strong>IDNO:</strong> <span id="reviewIdno"></span></p>
                <p><strong>FIRSTNAME:</strong> <span id="reviewFirstname"></span></p>
                <p><strong>LASTNAME:</strong> <span id="reviewLastname"></span></p>
                <p><strong>SITIO:</strong> <span id="reviewSitio"></span></p>

                <div style="display: flex; gap: 10px;">
                    <button onclick="submitForm()" class="w3-button w3-blue">SAVE</button>
                    <button onclick="cancelAddStudent()" class="w3-button w3-red">CANCEL</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    Webcam.set({
        width: 250,
        height: 250,
        image_format: 'jpeg',
        jpeg_quality: 90
    });
    Webcam.attach('#webcam');

    let capturedImage = '';

    function validateIDNO() {
        const idnoInput = document.getElementById('idno');
        idnoInput.value = idnoInput.value.replace(/[^0-9]/g, '');
        enableSnapButton();
    }

    function enableSnapButton() {
        const idno = document.getElementById('idno').value.trim();
        const firstname = document.getElementById('firstname').value.trim();
        const lastname = document.getElementById('lastname').value.trim();
        const sitio = document.getElementById('sitio').value;

        document.getElementById('snapButton').disabled = !(idno && firstname && lastname && sitio);
    }

    function capturePhoto() {
        Webcam.snap(function(data_uri) {
            capturedImage = data_uri;
            document.getElementById('reviewPhoto').src = data_uri;
            document.getElementById('reviewPhoto').style.display = "block";

            document.getElementById('reviewIdno').textContent = document.getElementById('idno').value;
            document.getElementById('reviewFirstname').textContent = document.getElementById('firstname').value;
            document.getElementById('reviewLastname').textContent = document.getElementById('lastname').value;
            document.getElementById('reviewSitio').textContent = document.getElementById('sitio').value;
        });
    }

    function submitForm() {
        if (!capturedImage) {
            alert("Please snap a photo before saving.");
            return;
        }

        const form = document.getElementById('studentForm');
        const formData = new FormData(form);
        formData.append('image', capturedImage);

        fetch('/saveinformation', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Student data saved successfully');
                window.location.href = '/mainpage';  
            } else {
                alert(data.message || 'Failed to save student data');
            }
        })
        .catch(error => {
            alert('An error occurred: ' + error);
        });
    }

    function cancelAddStudent() {
        window.location.href = '/mainpage'; 
    }
</script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

{% endblock %}
