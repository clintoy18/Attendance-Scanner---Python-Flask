<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie-edge,safari">
		<link rel="stylesheet" href="{{ url_for('static',filename='css/w3.css')}}">
		<title>Student Information V1.0</title>
	</head>
	<body onload="myfocus()">
		<div class="w3-bar w3-container w3-padding w3-blue" style="display: flex; align-items: center; justify-content: space-between;">
			<!-- Title aligned to the left -->
			<h3 style="margin: 0;">{{ pagetitle }}</h3>
			
			<!-- Navigation links aligned to the right -->
			<div style="display: flex; gap: 10px;">
				<a href="/mainpage" class="w3-bar-item w3-button">Home</a>
				<a href="{{ url_for('studlist') }}" class="w3-bar-item w3-button {% if request.endpoint == 'home' %}w3-light-grey{% endif %}">Student List</a>
				<a href="/attendance" class="w3-bar-item w3-button">Attendance</a>
				<a href="{{ url_for('admin') }}" class="w3-bar-item w3-button">Logout</a>
			</div> 
		</div>
		
		
		<div class="w3-container w3-padding">
			{% block content %}
			{% endblock %}
			<hr/>
			<div class="w3-center">
				&copy;Copyright @2024, Alonzo Clint, Aldrian Bahan
			</div>
		</div>
	</body>
